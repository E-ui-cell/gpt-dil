name: Validate GPT-DIL

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - "userscripts/**"
      - "docs/**"
      - "README.md"
      - "Capture-Local.ps1"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "userscripts/**"
      - "docs/**"
      - "README.md"
      - "Capture-Local.ps1"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check tools/capture-chatgpt.mjs
          node --check tools/capture-local-chrome.mjs
          node --check tools/dil-bridge-hook.js
          node --check tools/analyze-dil-bridge.mjs
          node --check userscripts/plain-text-payload.user.js
          node --check userscripts/terminal-mode.user.js
          $testFiles = Get-ChildItem -Path tests -Filter "*.test.mjs" -File
          if (-not $testFiles) { throw "No tests found" }
          foreach ($testFile in $testFiles) {
            node --test $testFile.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @("Capture-Local.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error ($errors | Out-String)
              exit 1
            }
          }
